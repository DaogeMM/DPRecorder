# 资源包信息（当前格式，字段含义见 DPS/dps/src/core/resource.rs 的 ResPackInfo）
# 按键贴图：Tap / Drag / Flick 与打击特效取自 example/res/Phigros_2024愚人节材质包.zip（连同
# 它那份 info.yml 里的贴图参数）；Hold 用 Phigros 原始散图拼（散图与拼图脚本放在工作区的
# .tmp\RetriSP-raw\，本机专用、不随仓库分发），
# digits/ 与 title/ 是报应SP 界面专用的手绘素材，材质包里没有，继续沿用原来的。
name: Phigros SP Retribution
author: PigeonGames
description: 还原依据为 phigros Retribution ~ Cycle of Redemption ~ 的 SP 谱面按键素材：Tap / Drag / Flick 用 2024 愚人节材质包，Hold 用原始散图
# 打击特效帧数：hit_fx.png 为 1280×1536，横 5 帧、竖 6 帧（单帧 256×256）
hitFx: [5, 6]
# 打击特效缩放比例（材质包的值）
hitFxScale: 1.5
# 打击特效不随 Note 旋转（材质包的值；报应SP 模式另有开关覆盖）
hitFxRotate: false
# 打击时隐藏方形粒子（材质包的值）
hideParticles: true
# Hold 贴图从上到下依次是尾部、中间和头部，这里给尾部与头部的高度（像素）
# hold.png 989×2000 ⇒ 尾部 50（Hold_End #5599）、头部 50（Hold_Head #5575）、
# 中间 1900（整张 Hold #5512：白边沿长度有弯、两端各带一圈内阴影，整段拉伸才留得住）
holdAtlas: [50, 50]
# 双押 Hold 同上：尾仍是 Hold_End（横向拉到 1016 后高 51），
# 头是 Hold2HL_0 #5532（98），中间是整张 Hold2HL_1 #5472（横向拉到 1016 后高 1808）
# hold_mh.png 1016×1957 ⇒ 尾部 51、头部 98、中间 1808
holdAtlasMH: [51, 98]
# Hold 中间部分整段拉伸（不做重复式平铺）：双押条身的黄色提示烧在 Hold2HL_1 的下半
# 部分，只有把它整张放进中间段，黄色才会落在靠近头部的一段、往上渐白；
# 平铺只取中段那一条，黄色会被整个切掉
holdRepeat: false
