[package]
name = "dps-ui"
version = "0.4.0"
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["lib", "cdylib"]

[features]
default = ["play"]
closed = ["dps/closed"]
chat = []
aa = []
play = []

[dependencies]
anyhow = "1.0"
arc-swap = "1.6.0"
base64 = "0.22.1"
bitflags = "2.2.1"
bytes = "1.4.0"
cacache = { version = "*", default-features = false, features = ["tokio-runtime"] }
chrono = { version = "0.4.23", features = ["serde"] }
futures-util = "0.3.25"
hex = "0.4.3"
# 这里必须是 0.24，不能写成 `*`：单一工作区里解析依赖时，`*`
# 会被解析成 image 0.25.10，而同一个工作区里的 `dps`（../dps/Cargo.toml）用的是
# `image = "0.24"`，于是依赖图里同时存在两个 image：`SafeTexture: From<DynamicImage>`
# （在 dps 侧基于 0.24 实现）和 ui 侧传进来的 `DynamicImage`（0.25）对不上，报
#   error[E0308]: mismatched types … expected `image::dynimage::DynamicImage`, found `DynamicImage`
#   error[E0277]: the trait bound `SafeTexture: From<DynamicImage>` is not satisfied
# 钉成 0.24 与 `dps` 对齐。
image = "0.24"
lru = "0.16.0"
lyon = "*"
macroquad = { git = "https://github.com/2278535805/prpr-macroquad", default-features = false }
md5 = "0.7"
nalgebra = "*"
once_cell = "*"
pollster = "0.2.5"
dps = { path = "../dps" }
rand = "0.9.2"
regex = "1.7.0"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "gzip", "charset", "http2", "system-proxy", "native-tls", "query"] }
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_yaml = "0.9.33"
sha2 = "*"
smallvec = "1.10.0"
tap = "1.0.1"
tokio = { version = "*", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.37"
walkdir = "2.3.3"
zip = { version = "8.3.0", default-features = false, features = ["deflate-flate2"] }
zstd = "0.13.3"

phira-mp-client = { git = "https://github.com/TeamFlos/phira-mp" }
phira-mp-common = { git = "https://github.com/TeamFlos/phira-mp" }
uuid = { version = "1.3.3", features = ["v4"] }
logos = "0.13.0"

[target.'cfg(target_os = "android")'.dependencies]
ndk-sys = "0.2"
ndk-context = "0.1"
sasa = { git = "https://github.com/2278535805/sasa", default-features = false, features = ["oboe"] }
openssl = { version = "*", features = ["vendored"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
sasa = { git = "https://github.com/2278535805/sasa" }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "*"
objc-foundation = "*"

[build-dependencies]
dotenv-build = "0.1"
