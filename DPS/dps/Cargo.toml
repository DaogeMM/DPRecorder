[package]
name = "dps"
version.workspace = true
edition = "2021"
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]

[features]
default = ["log", "play", "video"]
closed = []
log = ["dep:tracing-subscriber", "dep:colored"]
play = []
video = ["dep:prpr-avc"]

[dependencies]
chinese-number = "0.7.7"
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22.1"
cfg-if = "1.0.0"
chardetng = "0.1.17"
concat-string = "1.0.1"
csv = "1.1.6"
fastblur = "0.1.1"
fluent = "0.17.0"
fluent-syntax = "0.12.0"
glyph_brush = "0.7.12"
image = "0.24"
intl-memoizer = "0.5.1"
lru = "0.16.0"
lyon = "1.0.1"
macroquad = { git = "https://github.com/2278535805/prpr-macroquad", default-features = false }
miniquad = { git = "https://github.com/2278535805/prpr-miniquad" }
nalgebra = "*"
once_cell = "1.16.0"
ordered-float = "3.4.0"
phf = { version = "0.13.1", features = ["macros"] }
rand = "0.9.2"
rand_pcg = "0.9.0"
rayon = "1.7.0"
regex = "1.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.33"
symphonia = { version = "0.5", features = ["flac", "mp3", "ogg", "vorbis", "wav", "pcm"] }
sys-locale = "0.3.2"
tempfile = "3.3.0"
tracing = "0.1.37"
unic-langid = { version = "0.9.1", features = ["macros"] }
zip = { version = "8.3.0", default-features = false, features = ["deflate-flate2"] }

byteorder = "1.4.3"
chrono = { version = "0.4.24", features = ["serde"] }
hex = "0.4.3"
hmac = "0.12.1"
miniz_oxide = "0.8.9"
obfstr = "=0.4.1"
sha2 = "0.10.6"
subtle = "2.4.1"
libc = "0.2.142"
bitflags = { version = "2.2.1", features = ["serde"] }
color-thief = "0.2.2"

tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
colored = { version = "2.0.0", optional = true }

prpr-avc = { path = "../prpr-avc", optional = true }
lazy_static = "1.5.0"
rustc-hash = "2.1.2"

# wasm 上取文件走浏览器自己的 `<input type=file>`，没有 rfd 的位置
[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
rfd = { version = "0.15.3", default-features = false, features = ["gtk3"] }

# 控制台准备（UTF-8 代码页、ANSI 转义）用，见 `log::init_console`。
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["consoleapi", "processenv", "wincon"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc = "*"
objc-foundation = "0.1.1"
objc_id = "*"
block = "0.1.6"

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
sasa = { git = "https://github.com/2278535805/sasa", default-features = false, features = ["oboe"] }
[target.'cfg(not(target_os = "android"))'.dependencies]
sasa = { git = "https://github.com/2278535805/sasa" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.23", features = ["rt-multi-thread", "fs"] }
# 打开外部链接：wasm 上走 `window.open`，见 `ext::open_url`
open = "5.3.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = "1.23"
web-sys = { version = "0.3", features = [
	"Location",
	"Performance",
	"UrlSearchParams",
	"Window",
] }
js-sys = "^0.3.85"
wasm-bindgen = "*"
wasm-bindgen-futures = "0.4"
# getrandom 0.3（rand 0.9 带进来）在 wasm32-unknown-unknown 上要显式打开 wasm_js 后端，
# 配合编译参数 `--cfg getrandom_backend="wasm_js"` 才能编过。
getrandom = { version = "0.3", features = ["wasm_js"] }
# cpal 的 WebAudio 后端只在 `wasm-bindgen` 这个隐式 feature 下编译，不开它就是 `host::null`
# （能编过但不出声）。这里显式打开，声音就交给浏览器自己的 AudioContext。
cpal = { version = "0.16.0", features = ["wasm-bindgen"] }

[build-dependencies]
walkdir = "2.3.2"

[dev-dependencies]
# 手工造带错误的 zip 包（见 `core::appendant` 的用例）要算 CRC32
crc32fast = "1.4"
